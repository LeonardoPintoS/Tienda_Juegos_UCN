[project]
name = "GameVault UCN"
version = "0.1.0"
description = "GameVault UCN  - Plataforma de gestión de videojuegos"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = ["E",
 "E",       #pycodestyle errors
 "F",       #pyflakes
 "I",       #isort (orden de imports)
 "UP",      #pyupgrade 
 "B",       #flake8-bugbear
 "SIM",     #flake8-simplify 
 "C4"       #flake8-comprehensions 
 ]

 ignore = [
    "E501",  # el largo de la linea ya lo controla el ruff-format
 ]

 [tool.ruff.lint.isort]
 known-first-party = ["app"]

 [tool.ruff.format]
 quote-style = "double"
 indent-style = "space"